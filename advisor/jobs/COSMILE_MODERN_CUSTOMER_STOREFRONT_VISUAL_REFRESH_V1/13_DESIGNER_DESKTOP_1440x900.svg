<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">COSMILE 현대 고객 스토어프론트 데스크톱 후보</title>
  <desc id="desc">전화기 프레임 없는 1440×900 홈 화면. 수량과 무관한 편집형 소개 뒤에 현재 공개 테스트 상품 전체를 반응형 그리드로 표시한다.</desc>
  <defs>
    <linearGradient id="paperGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6F0"/>
      <stop offset="1" stop-color="#EEEAE1"/>
    </linearGradient>
    <linearGradient id="mediaMist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F0EB"/>
      <stop offset="1" stop-color="#D5E2DC"/>
    </linearGradient>
    <linearGradient id="heroMist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE8E1"/>
      <stop offset="1" stop-color="#C7D9D0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#18211D" flood-opacity="0.07"/>
    </filter>
    <style>
      text { font-family: "Noto Sans CJK KR", "Noto Sans CJK", sans-serif; fill: #18211D; }
      .serif { font-family: "Noto Serif CJK KR", "Noto Serif CJK", serif; }
      .utility { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
      .nav { font-size: 14px; font-weight: 600; }
      .name { font-size: 15px; font-weight: 700; }
      .price { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .small { font-size: 12px; }
      .muted { fill: #617068; }
      .pine { fill: #24463C; }
      .persimmon { fill: #F15A35; }
      .white { fill: #FFFEFB; }
      .line { stroke: rgba(24,33,29,.14); }
