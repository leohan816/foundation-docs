<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">COSMILE 현대 고객 스토어프론트 모바일 상세 후보</title>
  <desc id="desc">390×844 실제 모바일 뷰포트에 한 admitted 테스트 상품의 정직한 미디어 대기 화면, 이름, 원화 가격, 찜, 장바구니 동작과 비프로덕션 안내를 표시한다.</desc>
  <defs>
    <linearGradient id="mobileMedia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F0EB"/>
      <stop offset="1" stop-color="#D2E0D9"/>
    </linearGradient>
    <linearGradient id="mobilePaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/>
      <stop offset="1" stop-color="#F4F1EA"/>
    </linearGradient>
    <filter id="barShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="-5" stdDeviation="10" flood-color="#18211D" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans CJK KR", "Noto Sans CJK", sans-serif; fill: #18211D; }
      .serif { font-family: "Noto Serif CJK KR", "Noto Serif CJK", serif; }
      .utility { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; }
      .pine { fill: #24463C; }
      .muted { fill: #617068; }
      .white { fill: #FFFEFB; }
    </style>
  </defs>

  <rect width="390" height="844" fill="url(#mobilePaper)"/>

  <!-- True viewport header, no device chrome -->
  <rect width="390" height="64" fill="#FFFEFB"/>
  <line x1="0" y1="63.5" x2="390" y2="63.5" stroke="#18211D" stroke-opacity=".13"/>
  <g transform="translate(16 18)" fill="none" stroke="#24463C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2L2 14l10 12"/>
  </g>
  <g transform="translate(53 16)">
    <rect width="32" height="32" rx="16" fill="#24463C"/>
    <circle cx="16" cy="16" r="6" fill="none" stroke="#FFFEFB" stroke-width="1.8"/>
    <path d="M16 7v18M7 16h18" stroke="#F15A35" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="94" y="40" font-size="18" font-weight="800" letter-spacing=".03em">COSMILE</text>
  <g transform="translate(340 19)" fill="none" stroke="#24463C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 2h4l3 15h17l3-11H7"/>
    <circle cx="11" cy="23" r="2" fill="#24463C"/><circle cx="23" cy="23" r="2" fill="#24463C"/>
  </g>
  <circle cx="370" cy="17" r="8" fill="#F15A35"/>
  <text x="370" y="20.5" text-anchor="middle" font-size="9" font-weight="800" class="white" data-bind="cartCount">0</text>

  <rect y="64" width="390" height="34" fill="#24463C"/>
  <circle cx="17" cy="81" r="3" fill="#F15A35"/>
  <text x="28" y="85" font-size="11" font-weight="600" class="white">비프로덕션 테스트 쇼핑 · 실제 청구와 배송 없음</text>

  <!-- Truthful non-representational media pending surface -->
  <g transform="translate(16 114)">
    <rect width="358" height="246" rx="18" fill="url(#mobileMedia)"/>
    <rect x="18" y="20" width="4" height="34" rx="2" fill="#F15A35"/>
    <text x="31" y="35" class="utility pine" font-size="10">CURRENT ITEM</text>
    <circle cx="294" cy="62" r="74" fill="#FFFEFB" opacity=".42"/>
    <circle cx="306" cy="74" r="42" fill="none" stroke="#24463C" stroke-opacity=".13" stroke-width="1"/>
    <path d="M76 116h206M98 129h162" stroke="#24463C" stroke-opacity=".16" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(116 156)">
      <rect width="126" height="52" rx="26" fill="#FFFEFB" opacity=".82"/>
      <path d="M24 18h18M24 26h25M24 34h15" stroke="#24463C" stroke-opacity=".38" stroke-width="2" stroke-linecap="round"/>
      <text x="84" y="25" text-anchor="middle" font-size="11" font-weight="700" class="pine">제품 이미지</text>
      <text x="84" y="39" text-anchor="middle" font-size="10" class="muted">준비 중</text>
    </g>
  </g>

  <!-- Product identity and actions remain data-backed -->
  <text x="16" y="389" class="utility pine" font-size="9">TEST CATALOG</text>
  <text x="16" y="426" class="serif" font-size="27" font-weight="700" data-bind="item.displayName">비타유스 아이백크림</text>
  <text x="16" y="461" font-size="22" font-weight="800" font-variant-numeric="tabular-nums" data-bind="formatKRW(item.price)">₩24,000</text>
  <g transform="translate(326 397)" id="mobile-wishlist-control" data-state-source="wishlist">
    <circle cx="24" cy="24" r="23" fill="#FFFEFB" stroke="#24463C" stroke-opacity=".34"/>
    <path d="M14 20c0-7 9-9 10-2 1-7 10-5 10 2 0 6-10 13-10 13S14 26 14 20z" fill="none" stroke="#24463C" stroke-width="1.8"/>
  </g>

  <g transform="translate(16 486)">
    <rect width="358" height="66" rx="13" fill="#DDE8E1"/>
    <circle cx="20" cy="20" r="4" fill="#F15A35"/>
    <text x="34" y="24" font-size="12" font-weight="700" class="pine">테스트 구매 안내</text>
    <text x="20" y="46" font-size="12" class="pine">표시 가격은 현재 카탈로그 기준이며 실제 청구·배송은 없습니다.</text>
  </g>

  <g transform="translate(16 571)">
    <text x="0" y="0" font-size="13" font-weight="700">구매 가능 상태</text>
    <line x1="0" y1="16" x2="358" y2="16" stroke="#18211D" stroke-opacity=".13"/>
    <text x="0" y="43" font-size="12" class="muted">현재 카탈로그에서 구매 가능한 테스트 상품입니다.</text>
  </g>

  <!-- Sticky purchase actions above reviewed route nav -->
  <g transform="translate(0 650)" filter="url(#barShadow)">
    <rect width="390" height="112" fill="#FFFEFB"/>
    <line x1="0" y1=".5" x2="390" y2=".5" stroke="#18211D" stroke-opacity=".13"/>
    <rect x="16" y="18" width="358" height="52" rx="16" fill="#F15A35"/>
    <text x="195" y="50" text-anchor="middle" font-size="14" font-weight="800" data-bind="formatKRW(item.price)">장바구니 담기 · ₩24,000</text>
    <g id="mobile-add-status-slot" data-bind="addStatus" aria-label="장바구니 담기 상태" aria-live="polite">
      <rect x="16" y="76" width="358" height="20" fill="none"/>
    </g>
  </g>

  <!-- Existing reviewed five-destination mobile navigation -->
  <g transform="translate(0 762)">
    <rect width="390" height="82" fill="#FFFEFB"/>
    <line x1="0" y1=".5" x2="390" y2=".5" stroke="#18211D" stroke-opacity=".13"/>
    <g transform="translate(39 15)" fill="none" stroke="#617068" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 12L10 3l10 9v12H2V12"/><path d="M7 24v-7h6v7"/>
    </g>
    <text x="49" y="56" text-anchor="middle" font-size="10" class="muted">홈</text>
    <g transform="translate(112 17)" fill="none" stroke="#617068" stroke-width="1.7">
      <rect x="1" y="2" width="22" height="20" rx="3"/><path d="M5 8h14M5 13h14M5 18h8"/>
    </g>
    <text x="124" y="56" text-anchor="middle" font-size="10" class="muted">상품</text>
    <g transform="translate(185 17)" fill="none" stroke="#F15A35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 2h4l3 15h17l3-11H7"/><circle cx="11" cy="23" r="2" fill="#F15A35"/><circle cx="23" cy="23" r="2" fill="#F15A35"/>
    </g>
    <text x="200" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#F15A35">장바구니</text>
    <g transform="translate(268 17)" fill="none" stroke="#617068" stroke-width="1.7" stroke-linejoin="round">
      <rect x="2" y="1" width="20" height="24" rx="3"/><path d="M7 7h10M7 12h10M7 17h7"/>
    </g>
    <text x="280" y="56" text-anchor="middle" font-size="10" class="muted">주문내역</text>
    <g transform="translate(348 15)" fill="none" stroke="#617068" stroke-width="1.7">
      <circle cx="10" cy="8" r="5"/><path d="M1 25c1-7 5-10 9-10s8 3 9 10"/>
    </g>
    <text x="358" y="56" text-anchor="middle" font-size="10" class="muted">MY</text>
  </g>
</svg>
