      <text x="1540" y="669" fill="#82530A" class="small" font-weight="700">보호 조치 없음</text>
    </g>

    <rect x="1520" y="714" width="350" height="76" rx="12" fill="#EAF0EC"/>
    <text x="1540" y="743" class="ui ink label">모바일은 사실 확인만</text>
    <text x="1540" y="766" class="ui muted small">보호된 작업은 데스크톱에서 진행합니다.</text>

    <text x="1520" y="833" class="ui ink label">진실 상태</text>
    <g class="ui data" font-size="9.5" font-weight="700">
