  <rect x="1500" y="70" width="390" height="844" rx="12" fill="none" stroke="#B8C0BA"/>

  <text x="30" y="1090" class="ui data" fill="#52605A" font-size="10">M1 DESIGN CANDIDATE · NO STOREFRONT CHROME · NO INVENTED KPI · NO PRODUCT WRITE</text>
</svg>
