      <rect x="1520" y="426" width="350" height="126" rx="12" class="surface" stroke="#E7D4A5"/>
      <rect x="1520" y="426" width="4" height="126" rx="2" fill="#A16207"/>
      <text x="1540" y="456" class="ink label">출고 대기</text>
      <rect x="1738" y="439" width="110" height="24" rx="12" fill="#FFF6DF"/>
      <text x="1751" y="456" class="data" fill="#82530A" font-size="10" font-weight="700">UNAVAILABLE</text>
      <text x="1540" y="486" class="muted small">확인되지 않은 주문 수는 표시하지 않습니다.</text>
      <line x1="1540" y1="503" x2="1850" y2="503" class="hair"/>
      <text x="1540" y="529" class="ink small" font-weight="700">안전한 다음 행동 · 읽기만 다시 확인</text>

      <rect x="1520" y="566" width="350" height="126" rx="12" class="surface" stroke="#E7D4A5"/>
      <rect x="1520" y="566" width="4" height="126" rx="2" fill="#A16207"/>
      <text x="1540" y="596" class="ink label">정합성 HOLD · 복구</text>
      <rect x="1707" y="579" width="141" height="24" rx="12" fill="#FFF6DF"/>
      <text x="1720" y="596" class="data" fill="#82530A" font-size="9.5" font-weight="700">NOT_CONFIGURED</text>
